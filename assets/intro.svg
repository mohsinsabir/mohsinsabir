<title id="title">Hey, I'm Mohsin</title>
<desc id="desc">I build applications with AI, natural language processing, and full stack development—from voice agents and image generation to tools that make language more accessible. I like taking an idea all the way to a usable interface: working with models, connecting APIs, and building the experience around them.</desc>
