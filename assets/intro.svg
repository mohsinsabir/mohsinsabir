<text x="103" y="41" fill="#6EE7CB" font-family="Consolas,monospace" font-size="9" letter-spacing="2">THE PERSON BEHIND THE PROJECTS</text>
<text x="101" y="77" fill="#F1F5F9" font-family="Segoe UI,Arial,sans-serif" font-size="33" font-weight="700">Hey, I'm Mohsin<tspan fill="#6EE7CB">.</tspan></text>
<g font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#CAD7E7">
<text x="28" y="117">I build applications with AI, natural language processing, and full stack development—</text>
<text x="28" y="140">from voice agents and image generation to tools that make language more accessible.</text>
<text x="28" y="174" fill="#A7BAD1">I like taking an idea all the way to a usable interface: working with models,</text>
<text x="28" y="197" fill="#A7BAD1">connecting APIs, and building the experience around them.</text>
</g>
